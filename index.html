<!doctype html>
<html lang="en" data-theme="finance" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Harn Kun makes splitting any shared bill or expense quick, clear, and effortless." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ebe8f3" />
    <link rel="canonical" href="https://Harn.fun/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harn Kun" />
    <meta property="og:title" content="Harn Kun — Split Bills Easily" />
    <meta property="og:description" content="Split shared bills and expenses quickly, clearly, and effortlessly." />
    <meta property="og:url" content="https://Harn.fun/" />
    <meta property="og:image" content="https://Harn.fun/icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Harn Kun app icon" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Harn Kun — Split Bills Easily" />
    <meta name="twitter:description" content="Split shared bills and expenses quickly, clearly, and effortlessly." />
    <meta name="twitter:image" content="https://Harn.fun/icon.png" />
    <meta name="twitter:image:alt" content="Harn Kun app icon" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Harn Kun" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Harn Kun",
        "url": "https://Harn.fun/",
        "description": "Harn Kun makes splitting any shared bill or expense quick, clear, and effortless.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "THB"
        }
      }
    </script>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('harn-kun-theme') === 'dark' ? 'dark' : 'finance';
          const background = theme === 'dark' ? '#272432' : '#ebe8f3';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = background;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', background);
        } catch {}
      })();
    </script>
    <title>Harn Kun</title>
  </head>
  <body>
    <div id="root"></div>
    <script>var __BUNDLED_DEV__ = false;</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
