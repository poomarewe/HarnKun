    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://harn.fun/#website",
            "url": "https://harn.fun/",
            "name": "Harn Kun",
            "alternateName": "Harn.fun",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://harn.fun/#app",
            "name": "Harn Kun",
            "url": "https://harn.fun/",
            "description": "Split bills with friends for free. Add items manually or scan a receipt, assign each cost, and share a clear payment breakdown — no account needed.",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Any",
            "isPartOf": { "@id": "https://harn.fun/#website" },
            "featureList": [
              "Enter bill items manually or scan a receipt",
              "Assign shared items to friends",
              "Review a clear payment breakdown",
              "Save bill history in the browser",
              "Share read-only bill details"
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "THB"
            }
          }
        ]
      }
    </script>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('harn-kun-theme') === 'dark' ? 'dark' : 'finance';
          const background = theme === 'dark' ? '#272432' : '#ebe8f3';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = background;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', background);
        } catch {}
      })();
    </script>
    <title>Harn Kun | Free Bill Splitter for Friends</title>

    <div id="root"></div>
