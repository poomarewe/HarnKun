<!doctype html>
<html lang="en" data-theme="finance" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Harn Kun makes splitting any shared bill or expense quick, clear, and effortless." />
    <meta name="theme-color" content="#ebe8f3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Harn Kun" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('harn-kun-theme') === 'dark' ? 'dark' : 'finance';
          const background = theme === 'dark' ? '#272432' : '#ebe8f3';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = background;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', background);
        } catch {}
      })();
    </script>
    <title>Harn Kun</title>
  </head>
  <body>
    <div id="root"></div>
    <script>var __BUNDLED_DEV__ = false;</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
