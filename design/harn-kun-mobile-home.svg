<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <title>Harn Kun — Maggie-inspired mobile home mockup</title>
  <desc>Editable mobile home screen concept for splitting bills, with a warm editorial style, original receipt illustration, recent bills, and a prominent create action.</desc>
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17383D" flood-opacity="0.10"/>
    </filter>
    <filter id="receipt-shadow" x="-25%" y="-20%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17383D" flood-opacity="0.16"/>
    </filter>
    <clipPath id="screen-clip"><rect x="0" y="0" width="390" height="844" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#screen-clip)">
    <rect width="390" height="844" fill="#FFF8E9"/>
    <path d="M276 -50C361 -23 420 54 411 133C403 206 343 240 281 220C226 202 209 148 228 91C247 35 223 -25 276 -50Z" fill="#FFE7A5"/>
    <path d="M-54 751C15 710 80 735 107 793C134 851 92 906 26 907C-40 908 -92 877 -91 819C-90 790 -79 765 -54 751Z" fill="#FBE0D0" opacity=".65"/>

    <!-- Status bar -->
    <text x="27" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#17383D">9:41</text>
    <g transform="translate(316 15)" stroke="#17383D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 7.5C4 3.5 10 3.5 14 7.5"/><path d="M3 10.5c2.2-2.2 5.8-2.2 8 0"/><circle cx="7" cy="13" r="1" fill="#17383D" stroke="none"/>
      <path d="M23 4h17a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H23a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M44 8v6"/><rect x="24.5" y="5.5" width="13.5" height="11" rx="1" fill="#17383D" stroke="none"/>
    </g>

    <!-- Brand header -->
    <g transform="translate(24 48)">
      <path d="M17 0C25.8 0 33 7.2 33 16S25.8 32 17 32 1 24.8 1 16 8.2 0 17 0Z" fill="#F16F59"/>
      <path d="M9 11.5h16M9 16h11M9 20.5h7" stroke="#FFF8E9" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M24 2c1.2-3.2 3.3-4.1 6.2-3.2-1 2.9-2.9 4.1-6.2 3.2Z" fill="#477B62"/>
    </g>
    <text x="66" y="62" font-family="Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="-.6" fill="#17383D">Harn Kun</text>
    <text x="67" y="78" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.75" fill="#69807A">GOOD TIMES, SHARED FAIRLY</text>
    <circle cx="343" cy="64" r="21" fill="#FFFFFF" stroke="#F0E8D6"/>
    <path d="M347.5 55a10.5 10.5 0 1 0 8.7 16.4 9.1 9.1 0 0 1-8.7-16.4Z" fill="#E68B61"/>
    <circle cx="355.5" cy="55.5" r="1.7" fill="#F1C656"/>

    <!-- Editorial hero -->
    <text x="25" y="121" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2.1" fill="#477B62">LESS MATH. MORE MEMORIES.</text>
    <text x="22" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="-1.8" fill="#17383D">Good times.</text>
    <text x="22" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="-1.8" fill="#F16F59">Fair shares.</text>
    <path d="M27 214C67 220 119 219 170 213" stroke="#E7B93F" stroke-width="3" stroke-linecap="round"/>
    <text x="25" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#536A66">Split the bill with your people,</text>
    <text x="25" y="257" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#536A66">minus the awkward math.</text>

    <!-- Original receipt and dinner illustration -->
    <g transform="rotate(8 324 185)" filter="url(#receipt-shadow)">
      <path d="M285 128h75v107l-7-4-8 5-8-5-8 5-8-5-8 5-8-5-8 5-7-5-7 4V128Z" fill="#FFFFFF"/>
      <path d="M298 145h31" stroke="#CBD9CE" stroke-width="3" stroke-linecap="round"/>
      <path d="M298 156h48M298 168h39" stroke="#E4E9E0" stroke-width="2" stroke-linecap="round"/>
      <path d="M298 183h48" stroke="#E4E9E0" stroke-width="2" stroke-linecap="round"/>
      <path d="M298 195h29" stroke="#E4E9E0" stroke-width="2" stroke-linecap="round"/>
      <path d="M298 211h48" stroke="#F16F59" stroke-width="2.7" stroke-linecap="round"/>
      <circle cx="345" cy="145" r="6" fill="#D9EDB6"/>
      <path d="M343 145h4m-2-2v4" stroke="#477B62" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <circle cx="281" cy="129" r="16" fill="#D9EDB6"/>
    <path d="M278 129c0-4 6-6 8-2 2 4-6 8-8 2Z" fill="#477B62"/>
    <path d="M278 129c-2-4-5-3-6-1 2 3 4 3 6 1Z" fill="#477B62"/>
    <path d="M365 219l4 4m-4 0 4-4" stroke="#E5B946" stroke-width="2" stroke-linecap="round"/>
    <path d="M275 224l2.4 2.4m-2.4 0 2.4-2.4" stroke="#F16F59" stroke-width="1.7" stroke-linecap="round"/>

    <!-- Main action -->
    <g filter="url(#card-shadow)">
      <rect x="22" y="284" width="346" height="60" rx="20" fill="#F16F59"/>
      <circle cx="56" cy="314" r="16" fill="#FFF8E9"/>
      <path d="M56 306v16m-8-8h16" stroke="#F16F59" stroke-width="2.5" stroke-linecap="round"/>
      <text x="84" y="311" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Split a bill</text>
      <text x="84" y="328" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#FFEAE3">Add friends, scan, and split in a few taps</text>
      <path d="M340 309l5 5-5 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Recent bills heading -->
    <text x="25" y="390" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1.8" fill="#477B62">YOUR RECENT BILLS</text>
    <text x="23" y="421" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" letter-spacing="-.8" fill="#17383D">Good times, lately</text>
    <rect x="318" y="397" width="49" height="24" rx="12" fill="#F3EBD9"/>
    <text x="342.5" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#647870">SEE ALL</text>

    <!-- Bill card one -->
    <g filter="url(#card-shadow)">
      <rect x="22" y="440" width="346" height="112" rx="20" fill="#FFFFFF"/>
      <rect x="22" y="440" width="7" height="112" rx="3.5" fill="#E8BD4E"/>
      <circle cx="63" cy="479" r="21" fill="#FBE5D3"/>
      <path d="M53 480c0-7 5-12 11-12 6 0 10 5 10 12 0 5-4 10-10 10-6 0-11-5-11-10Z" fill="#F16F59"/>
      <path d="M57 478h13m-11 4h9" stroke="#FFF8E9" stroke-width="1.7" stroke-linecap="round"/>
      <text x="95" y="466" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#8D9D91">TODAY · 7:42 PM</text>
      <text x="95" y="488" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#17383D">Friday dinner</text>
      <g font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">
        <circle cx="101" cy="520" r="10" fill="#DCEAD6"/><text x="101" y="523" fill="#477B62">A</text>
        <circle cx="116" cy="520" r="10" fill="#F8D9C8"/><text x="116" y="523" fill="#B75B4C">B</text>
        <circle cx="131" cy="520" r="10" fill="#E6DCF0"/><text x="131" y="523" fill="#756095">F</text>
      </g>
      <text x="149" y="523" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#788B80">4 people · 6 items</text>
      <text x="342" y="485" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#17383D">฿1,840</text>
      <text x="342" y="503" text-anchor="end" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#8D9D91">TOTAL</text>
      <path d="M347 521l4 4-4 4" stroke="#A7B2A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bill card two -->
    <g filter="url(#card-shadow)">
      <rect x="22" y="566" width="346" height="112" rx="20" fill="#FFFFFF"/>
      <rect x="22" y="566" width="7" height="112" rx="3.5" fill="#8CB79B"/>
      <circle cx="63" cy="605" r="21" fill="#E3EEDC"/>
      <path d="M53 609c0-8 5-13 11-13 6 0 10 5 10 11 0 7-5 12-12 12-5 0-9-4-9-10Z" fill="#8CB79B"/>
      <path d="M64 596c1-5 4-7 8-7 0 4-3 7-8 7Z" fill="#477B62"/>
      <path d="M57 604c4-2 9-2 14 0" stroke="#F8FFF2" stroke-width="1.5" stroke-linecap="round"/>
      <text x="95" y="592" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#8D9D91">YESTERDAY · 1:18 PM</text>
      <text x="95" y="614" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#17383D">Beach picnic</text>
      <g font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">
        <circle cx="101" cy="646" r="10" fill="#F7E4AC"/><text x="101" y="649" fill="#997323">M</text>
        <circle cx="116" cy="646" r="10" fill="#DCE7EF"/><text x="116" y="649" fill="#4C718B">P</text>
        <circle cx="131" cy="646" r="10" fill="#F8D9C8"/><text x="131" y="649" fill="#B75B4C">G</text>
      </g>
      <text x="149" y="649" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#788B80">3 people · 4 items</text>
      <text x="342" y="611" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#17383D">฿960</text>
      <text x="342" y="629" text-anchor="end" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#8D9D91">TOTAL</text>
      <path d="M347 647l4 4-4 4" stroke="#A7B2A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Small friendly footer illustration and navigation hint -->
    <g transform="translate(25 712)">
      <path d="M1 14c5-9 12-13 20-12 8 1 12 6 12 12H1Z" fill="#E6B946"/>
      <path d="M3 15c2 5 7 8 14 8s12-3 14-8H3Z" fill="#F16F59"/>
      <path d="M9 13c1-3 3-4 5-4m4 4c1-3 3-4 5-4" stroke="#FFF8E9" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="68" y="726" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#71867B">Every share, sorted.</text>
    <text x="365" y="726" text-anchor="end" font-family="Arial, sans-serif" font-size="8" font-weight="800" letter-spacing="1.3" fill="#A0AA9D">HARN KUN · THAILAND</text>

    <!-- Home indicator -->
    <rect x="145" y="823" width="100" height="4" rx="2" fill="#17383D" opacity=".72"/>
  </g>

  <!-- Figma frame keyline -->
  <rect x=".5" y=".5" width="389" height="843" rx="33.5" stroke="#DCD3C0"/>
</svg>
